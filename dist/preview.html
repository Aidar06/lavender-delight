<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="/">
  <title>Lavender Delight — превью</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <style>html,body{margin:0;overflow:hidden}.hero{min-height:100svh}.scroll-cue{display:none}</style>
</head>
<body>
  <main>
    <section class="hero" id="welcome">
      <img class="botanical botanical--hero-left" src="assets/botanical-left.webp" alt="" fetchpriority="high">
      <img class="botanical botanical--hero-right" src="assets/botanical-right.webp" alt="" fetchpriority="high">
      <div class="hero__wash" aria-hidden="true"></div>
      <div class="hero__card reveal is-visible">
        <img class="graphic-frame graphic-frame--tall" src="assets/frame-tall.svg" alt="">
        <div class="monogram" aria-hidden="true"><span>Б</span><b>&amp;</b><span>А</span></div>
        <p class="eyebrow">Приглашение на свадьбу</p>
        <h1 class="hero__names"><span>Бекзат</span><i>&amp;</i><span>Алина</span></h1>
        <img class="small-ornament" src="assets/ornament-divider.svg" alt="">
        <p class="hero__date">12 июня 2027</p>
      </div>
      <img class="hero__seal" src="assets/wax-seal.webp" alt="" width="180" height="180">
    </section>
  </main>
</body>
</html>
